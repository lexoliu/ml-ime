name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Each job below runs only when something it reads changed. A change to this
  # workflow, and a push to main, runs them all.
  changes:
    name: changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      python: ${{ steps.areas.outputs.python }}
      tables: ${{ steps.areas.outputs.tables }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            printf '%s=true\n' rust python tables >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "$changed"
          area() {
            if printf '%s\n' "$changed" | grep -qE "^(\.github/workflows/ci\.yml\$|$2)"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi >> "$GITHUB_OUTPUT"
          }
          # Rust reads nothing outside crates/.
          area rust 'crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$'
          # The Python tests read the Rust side's tables and fixtures.
          area python 'python/|colab/|kaggle/|crates/[^/]+/data/|crates/[^/]+/tests/fixtures/'
          # The generator and what it writes.
          area tables 'python/|crates/ime-pinyin/data/'

  rust:
    name: rust / ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      - name: Log runner CPU (for ISA-dispatch bug triage)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then lscpu; else sysctl machdep.cpu; fi
      - run: cargo nextest run --workspace --all-targets
      - run: cargo test --workspace --doc

  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    # The suite takes about four minutes; a hung test once held this job for six hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

  generated-tables:
    name: generated tables are current
    needs: changes
    if: needs.changes.outputs.tables == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Regenerate the pinyin tables
        working-directory: python
        run: uv run mlime gen-pinyin-tables --out-dir ../crates/ime-pinyin/data
      - name: Fail if they differ from what is committed
        run: |
          if ! git diff --exit-code -- crates/ime-pinyin/data; then
            echo "::error::crates/ime-pinyin/data is stale; run 'uv run mlime gen-pinyin-tables' and commit"
            exit 1
          fi
