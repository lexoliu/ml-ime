[package]
name = "ime-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# `--backend coreml` on `fused-eval`: Apple's ANE/GPU provider.
gpu-coreml = ["ime-lm/gpu-coreml", "ime-neural/gpu-coreml"]
# `--backend webgpu` on `fused-eval`: Dawn over Metal.
gpu-webgpu = ["ime-lm/gpu-webgpu", "ime-neural/gpu-webgpu"]
# `--backend cuda` on `fused-eval`: NVIDIA's CUDA provider.
gpu-cuda = ["ime-lm/gpu-cuda", "ime-neural/gpu-cuda"]

[dependencies]
anyhow.workspace = true
askama.workspace = true
blake2.workspace = true
clap.workspace = true
const-hex.workspace = true
flate2.workspace = true
ime-corpus.workspace = true
ime-decode.workspace = true
ime-eval.workspace = true
ime-g2p.workspace = true
ime-lm.workspace = true
ime-neural.workspace = true
ime-ngram.workspace = true
ime-pinyin.workspace = true
ime-synth.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
