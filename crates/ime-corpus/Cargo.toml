[package]
name = "ime-corpus"
version = "0.1.0"
description = "Fetch and prepare internet-authentic Chinese corpora into sample shards"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
aho-corasick = { version = "1.1.5", default-features = false, features = ["std", "perf-literal"] }
blake2.workspace = true
const-hex.workspace = true
csv.workspace = true
ferrous-opencc.workspace = true
flate2.workspace = true
foldhash = { version = "0.2.0", default-features = false, features = ["std"] }
futures.workspace = true
ime-g2p.workspace = true
ime-pinyin.workspace = true
polars.workspace = true
rayon.workspace = true
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
reqwest.workspace = true
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt-multi-thread", "time"] }
tracing.workspace = true
unicode-normalization.workspace = true

[lints]
workspace = true
