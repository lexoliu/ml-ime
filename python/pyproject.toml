[project]
name = "mlime"
version = "0.1.0"
description = "Data pipeline and training for ml-ime, a context-conditioned neural Chinese pinyin input method"
requires-python = ">=3.12"
dependencies = [
    "pypinyin>=0.53",
    "polars>=1.17",
    "pyarrow>=18",
    "tqdm>=4.67",
    "typer>=0.15",
    "structlog>=24.4",
    "rich>=13.9",
]

[project.scripts]
mlime = "mlime.__main__:app"

[project.optional-dependencies]
train = ["torch>=2.5", "transformers>=4.47", "safetensors>=0.4", "datasets>=3.2"]

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3", "mypy>=1.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "T20"]

[tool.mypy]
strict = true
