[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexoliu/ml-ime"
authors = ["Lexo Liu <me@lexo.cool>"]
rust-version = "1.90"

[workspace.dependencies]
ime-pinyin = { path = "crates/ime-pinyin" }
ime-decode = { path = "crates/ime-decode" }
ime-ngram = { path = "crates/ime-ngram" }
ime-neural = { path = "crates/ime-neural" }
ime-eval = { path = "crates/ime-eval" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic_in_result_fn = "deny"
