[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lexoliu/ml-ime"
authors = ["Lexo Liu <me@lexo.cool>"]
rust-version = "1.90"

[workspace.dependencies]
ime-pinyin = { path = "crates/ime-pinyin" }
ime-decode = { path = "crates/ime-decode" }
ime-ngram = { path = "crates/ime-ngram" }
ime-neural = { path = "crates/ime-neural" }
ime-eval = { path = "crates/ime-eval" }
ime-cli = { path = "crates/ime-cli" }
ime-g2p = { path = "crates/ime-g2p" }
ime-corpus = { path = "crates/ime-corpus" }
ime-synth = { path = "crates/ime-synth" }
ime-lm = { path = "crates/ime-lm" }
ime-session = { path = "crates/ime-session" }

anyhow = "1.0.104"
hashbrown = "0.15.5"
libc = "0.2"
async-openai = { version = "0.41.3", features = ["chat-completion"] }
askama = "0.16.0"
blake2 = "0.11.0"
bytemuck = "1.25.2"
clap = { version = "4.6.6", features = ["derive"] }
const-hex = "1.19.1"
csv = "1.4.0"
dotenvy = "0.15.7"
ferrous-opencc = "0.4.0"
flate2 = "1.1.5"
futures = "0.3.31"
memmap2 = "0.9"
ort = { version = "2.0.0-rc.13", features = ["half"] }
polars = { version = "0.55.2", default-features = false, features = ["parquet"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.9.2"
rayon = "1.12.0"
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
thread_local = "1.1.10"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"
unicode-normalization = "0.1.25"
unicode-script = "0.5.7"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic_in_result_fn = "deny"

[patch.crates-io]
# rc.13's prebuilt ONNX Runtime 1.28.0 compiles the avx2 MLAS translation
# units with -mavxvnni, so SQ8BitGemmKernel_*_avx2 emits AVX-VNNI
# instructions (vpdpwssd) and SIGILLs on x86-64 CPUs without AVX-VNNI
# (#98). The next commit on ort's main line only swaps the binaries to
# ONNX Runtime 1.30.0, whose upstream build puts the VNNI kernels in their
# own translation unit. Patching ort-sys alone keeps ort's rc.13 API.
ort-sys = { git = "https://github.com/pykeio/ort", rev = "6d7c231c3430026bd5e8262fc8d74e2307512ab1" }
